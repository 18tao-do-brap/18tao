<section class="interacao">
  <h2>Fala aí, piloto!</h2>

  <form id="formInteracao" method="post" action="#">
    <fieldset>
      <legend>Sobre você</legend>

      <label for="nome">Qual seu nome?</label>
      <input
        type="text"
        id="nome"
        name="nome"
        placeholder="Seu nome"
        required
      />

      <label for="idade">Quantos anos você tem?</label>
      <input
        type="number"
        id="idade"
        name="idade"
        min="1"
        max="120"
        required
      />

      <label for="andaMoto">Você anda de moto?</label>
      <select id="andaMoto" name="andaMoto" required>
        <option value="">Selecione</option>
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
      </select>
    </fieldset>

    <fieldset id="motoContainer" style="display: none;">
      <legend>Sua moto</legend>

      <label for="moto">Qual sua moto? (pode escolher várias)</label>
      <select
        id="moto"
        name="moto[]"
        multiple
        size="8"
      >
        <option value="crf250r">Honda CRF 250R</option>
        <option value="crf450r">Honda CRF 450R</option>
        <option value="crf230f">Honda CRF 230F</option>
        <option value="yz250">Yamaha YZ250</option>
        <option value="yz450f">Yamaha YZ450F</option>
        <option value="ktm250exc">KTM 250 EXC</option>
        <option value="ktm300exc">KTM 300 EXC</option>
        <option value="kx250">Kawasaki KX250</option>
        <option value="rmz450">Suzuki RM-Z450</option>
        <option value="husq_fe450">Husqvarna FE450</option>
      </select>
    </fieldset>

    <button type="submit">Enviar</button>
  </form>

  <div id="resposta"></div>
</section>
