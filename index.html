<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18tão do Brap</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #f0f0f0;
    }

    header {
      background-color: #da0d0dda;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5em;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .intro {
      padding: 40px 20px;
      text-align: center;
    }

    .galeria {
      padding: 20px;
      text-align: center;
    }

    .galeria h2 {
      margin-bottom: 20px;
    }

    .imagens {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .imagens img {
      width: 300px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px #ff0000;
      transition: transform 0.3s ease;
    }

    .imagens img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #222;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
    }

    .interacao {
      padding: 30px;
      background-color: #1e1e1e;
      border-top: 2px solid #ff0000;
      text-align: center;
    }

    .interacao form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 400px;
      margin: 0 auto;
    }

    .interacao input,
    .interacao select {
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      border: none;
    }

    .interacao button {
      padding: 10px 20px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .interacao button:hover {
      background-color: #e00000;
    }

    #resposta {
      margin-top: 20px;
      font-size: 1.1em;
      color: #00ff99;
    }

    /* --- LINK DO YOUTUBE COM FUNDO ANIMADO --- */
    .colorful-bg {
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      animation: bgColors 3s infinite linear;
    }

    @keyframes bgColors {
      0%   { background-color: red; }
      25%  { background-color: orange; }
      50%  { background-color: yellow; color: black; }
      75%  { background-color: green; color: white; }
      100% { background-color: red; }
    }
  </style>
</head>
<body>
  <header>
    <h1>18tão do Braap 🔥</h1>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Galeria</a></li>
        <li>
          <a href="https://www.youtube.com/@18T%C3%A3o.da_CRF/featured" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="colorful-bg">
             Youtube
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>Bem-vindo ao mundo do motocross!</h2>
      <p>Adrenalina, lama e muito Brap! Aqui é o lugar dos apaixonados por trilha, motocross e velocidade.</p>
      <p>Piloto de motocross oficial da Arena Race!</p>
    </section>

    <section class="galeria">
      <h2>Galeria do 18TÃO</h2>
      <div class="imagens">
        <img src="IMG_2744.jpeg" alt="motos" />
        <img src="IMG_3346.jpeg" alt="arte motocross" />
        <img src="2BF03B60-91F3-451B-801C-466A6C44DF36.jpeg" alt="moto" />
      </div>
