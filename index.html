<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>18tao do brap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>18tao do brap 🏍️</h1>
    <nav>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Galeria</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h2>Bem-vindo ao mundo do motocross!</h2>
      <p>Adrenalina, lama e muito brap! Aqui é o lugar dos apaixonados por trilha e velocidade.</p>
    </section>

    <section class="galeria">
      <h2>Galeria de Ação</h2>
      <div class="imagens">
        <img src="img1.jpg" alt="Piloto em salto radical" />
        <img src="img2.jpg" alt="Motocross na trilha" />
        <img src="img3.jpg" alt="Equipe reunida após corrida" />
      </div>
    </section>

    <section class="interacao">
  <h2>Fala aí, piloto!</h2>
  <form id="formInteracao">
    <label for="nome">Qual seu nome?</label>
    <input type="text" id="nome" required />

    <label for="idade">Quantos anos você tem?</label>
    <input type="number" id="idade" required />

    <label for="moto">Você anda de moto?</label>
    <select id="moto" required>
      <option value="">Selecione</option>
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <button type="submit">Enviar</button>
  </form>

  <div id="resposta"></div>
</section>

  </main>

  <footer>
    <p>&copy; 2025 18tao do brap. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
